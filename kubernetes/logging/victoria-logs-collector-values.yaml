collector:
  excludeFilter: "kubernetes.pod_namespace:in(kube-system, logging)"
  ignoreFields:
    - kubernetes.container_id
    - kubernetes.pod_ip
    - kubernetes.pod_node_name
    - kubernetes.pod_labels.pod-template-hash

remoteWrite:
  - url: http://victoria-logs-victoria-logs-single-server.logging.svc.cluster.local:9428