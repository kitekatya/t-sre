---
remoteWrite:
  - url: http://vm-single-victoria-metrics-single-server.monitoring.svc.cluster.local:8428/api/v1/write

config:
  global:
    scrape_interval: 15s

  scrape_configs:
    - job_name: kubernetes-pods
      kubernetes_sd_configs:
        - role: pod

      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          action: keep
          regex: "true"

        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)

        - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
          action: replace
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2
          target_label: __address__

        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod

        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace

    - job_name: blackbox
      metrics_path: /probe
      scrape_interval: 15s

      params:
        module: [ http_2xx ]

      static_configs:
        - targets:
            - http://backend.default.svc.cluster.local:8000/api/tasks
            - http://frontend.default.svc.cluster.local/

      relabel_configs:
        - source_labels: [ __address__ ]
          target_label: __param_target

        - source_labels: [ __param_target ]
          target_label: instance

        - target_label: __address__
          replacement: blackbox-prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115
...