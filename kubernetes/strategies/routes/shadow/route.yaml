apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: task-backend
spec:
  parentRefs:
  - name: task-eg
  rules:
  - matches:
    - method: GET
      path:
        type: Exact
        value: /version
    - method: GET
      path:
        type: PathPrefix
        value: /api/tasks
    filters:
    - type: RequestMirror
      requestMirror:
        backendRef:
          name: backend-v2
          port: 8000
    backendRefs:
    - name: backend-v1
      port: 8000
  - matches:
    - path:
        type: PathPrefix
        value: /api
    - path:
        type: Exact
        value: /version
    backendRefs:
    - name: backend-v1
      port: 8000
