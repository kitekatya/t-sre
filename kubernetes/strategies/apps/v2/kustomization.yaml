apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

nameSuffix: -v2

labels:
  - pairs:
      track: v2
    includeSelectors: true
    includeTemplates: true

  - pairs:
      version: v2
    includeTemplates: true

images:
  - name: task-tracker-backend
    newTag: v2

patches:
  - target:
      kind: Deployment
      name: backend
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
      spec:
        template:
          spec:
            containers:
              - name: backend
                env:
                  - name: APP_VERSION
                    value: v2