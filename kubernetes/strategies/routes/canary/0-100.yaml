apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: task-backend
spec:
  parentRefs:
  - name: task-eg
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api
    - path:
        type: Exact
        value: /version
    backendRefs:
    - name: backend-v1
      port: 8000
      weight: 0
    - name: backend-v2
      port: 8000
      weight: 100
