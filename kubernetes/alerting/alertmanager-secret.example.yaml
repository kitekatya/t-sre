---
apiVersion: v1
kind: Secret
metadata:
  name: task-alertmanager-config
  namespace: monitoring
type: Opaque
stringData:
  alertmanager.yaml: |
    route:
      receiver: webhook
      group_by: ["alertname"]
      group_wait: 5s
      group_interval: 15s
      repeat_interval: 1h

    receivers:
      - name: webhook
        webhook_configs:
          - url: "https://webhook.site/СЕКРЕТ"
            send_resolved: true
...