---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 60
  template:
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h db -p 5432; do
                echo "waiting for postgres..."
                sleep 2
              done
      containers:
      - name: migrate
        image: task-tracker-backend:latest
        imagePullPolicy: Never
        command:
        - alembic
        - upgrade
        - head
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: task-tracker-secret
              key: DATABASE_URL
      restartPolicy: Never
...