plugins:
  - victoriametrics-logs-datasource

adminUser: admin
adminPassword: admin

service:
  type: ClusterIP

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: VictoriaLogs
        type: victoriametrics-logs-datasource
        access: proxy
        url: http://victoria-logs-victoria-logs-single-server.logging.svc.cluster.local:9428
        isDefault: false

      - name: VictoriaMetrics
        uid: victoriametrics
        type: prometheus
        access: proxy
        url: http://vm-single-victoria-metrics-single-server.monitoring.svc.cluster.local:8428
        isDefault: true

persistence:
  enabled: true
  type: pvc
  accessModes:
    - ReadWriteOnce
  size: 1Gi

sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    searchNamespace: logging
    provider:
      allowUiUpdates: true