apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: task-backend
spec:
  parentRefs:
  - name: task-eg
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api
      headers:
      - type: Exact
        name: x-user-group
        value: beta
    - path:
        type: Exact
        value: /version
      headers:
      - type: Exact
        name: x-user-group
        value: beta
    backendRefs:
    - name: backend-v2
      port: 8000
  - matches:
    - path:
        type: PathPrefix
        value: /api
    - path:
        type: Exact
        value: /version
    backendRefs:
    - name: backend-v1
      port: 8000
