---
server:
  fullnameOverride: task-vmalert

  datasource:
    url: http://vm-single-victoria-metrics-single-server.monitoring.svc.cluster.local:8428

  notifier:
    url: http://task-alertmanager.monitoring.svc.cluster.local:9093

  config:
    alerts:
      groups:
        - name: task-tracker
          interval: 15s
          rules:
            - alert: BackendAvailabilityBelowSLA
              expr: |
                100 * avg_over_time(probe_success{
                  job="blackbox",
                  instance="http://backend.default.svc.cluster.local:8000/api/tasks"}[5m]
                ) < 99
              for: 1m
              labels: {severity: warning, sli: availability}
              annotations:
                summary: "Backend: доступность ниже SLA 99%"
            - alert: FrontendAvailabilityBelowSLA
              expr: |
                100 * avg_over_time(probe_success{
                  job="blackbox",
                  instance="http://frontend.default.svc.cluster.local/"}[5m]
                ) < 99
              for: 1m
              labels: {severity: warning, sli: availability}
              annotations:
                summary: "Frontend: доступность ниже SLA 99%"
            - alert: HttpSuccessBelowSLA
              expr: |
                (100 * (1 - (sum(increase(http_requests_total{
                  namespace="default",
                  job="kubernetes-pods",
                  status="5xx"}[5m])) or vector(0)
                ) 
                / sum(increase(http_requests_total{
                  namespace="default",
                  job="kubernetes-pods"}[5m])))
                ) < 99
                and on() sum(increase(http_requests_total{
                  namespace="default",
                  job="kubernetes-pods"}[5m])
                ) > 0
              for: 1m
              labels: {severity: warning, sli: http_success}
              annotations:
                summary: "Успешность HTTP без 5xx ниже SLA 99%"
            - alert: HttpLatencyBelowSLA
              expr: |
                (100 * sum(increase(http_request_duration_seconds_bucket{
                  namespace="default",
                  job="kubernetes-pods",
                  le="0.5"}[5m])
                )
                / sum(increase(http_request_duration_seconds_count{
                  namespace="default",
                  job="kubernetes-pods"}[5m]))
                ) < 90
                and on() sum(increase(http_request_duration_seconds_count{
                  namespace="default",
                  job="kubernetes-pods"}[5m])
                ) > 0
              for: 1m
              labels: {severity: warning, sli: latency}
              annotations:
                summary: "Доля запросов до 500 мс ниже SLA 90%"
            - alert: TaskCreationBelowSLA
              expr: |
                (100 * sum(increase(tasks_created_total{
                  namespace="default",
                  job="kubernetes-pods"}[5m])
                )
                / sum(increase(http_requests_total{
                  namespace="default", 
                  job="kubernetes-pods",
                  method="POST",
                  handler="/api/tasks"}[5m]))
                ) < 99
                and on() sum(increase(http_requests_total{
                  namespace="default",
                  job="kubernetes-pods",
                  method="POST",
                  handler="/api/tasks"}[5m])
                ) > 0
              for: 1m
              labels: {severity: warning, sli: task_create}
              annotations:
                summary: "Успешность создания задач ниже SLA 99%"
            - alert: TaskDeletionBelowSLA
              expr: |
                (100 * sum(increase(tasks_deleted_total{
                  namespace="default",
                  job="kubernetes-pods"}[5m])
                ) 
                / sum(increase(http_requests_total{
                  namespace="default",
                  job="kubernetes-pods",
                  method="DELETE",
                  handler="/api/tasks/{task_id}"}[5m]))
                ) < 99
                and on() sum(increase(http_requests_total{
                  namespace="default",
                  job="kubernetes-pods",
                  method="DELETE",
                  handler="/api/tasks/{task_id}"}[5m])
                ) > 0
              for: 1m
              labels: {severity: warning, sli: task_delete}
              annotations:
                summary: "Успешность удаления задач ниже SLA 99%"
            - alert: BackendHighMemory
              expr: |
                (
                  100 * process_resident_memory_bytes{
                    namespace="default",
                    pod=~"backend-.*"
                  }
                  / on(namespace, pod)
                  backend_memory_limit_bytes{
                    namespace="default",
                    pod=~"backend-.*"
                  }
                ) > 80
                and on(namespace, pod)
                backend_memory_limit_bytes{
                  namespace="default",
                  pod=~"backend-.*"
                } > 0
              for: 1m
              labels:
                severity: warning
              annotations:
                summary: "Python-процесс Backend использует более 80% лимита памяти контейнера"

alertmanager:
  enabled: true
  fullnameOverride: task-alertmanager

  persistentVolume:
    enabled: false

  configSecret: task-alertmanager-config
...