
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

nameSuffix: -v1

labels:
  - pairs:
      track: v1
    includeSelectors: true
    includeTemplates: true

  - pairs:
      version: v1
    includeTemplates: true

images:
  - name: task-tracker-backend
    newTag: v1
